<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dummy</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        background: #121212; /* Dark background */
        color: #e0e0e0;      /* Light text */
        padding: 20px;
    }

    h1 {
        text-align: center;
        color: #ffffff;
    }

    .file {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #1e1e1e; /* Dark card background */
        margin: 10px 0;
        padding: 12px 18px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,.5);
    }

    button {
        padding: 8px 18px;
        border: none;
        border-radius: 5px;
        background: #1976d2; /* Blue accent */
        color: white;
        cursor: pointer;
        font-size: 14px;
    }

    button:hover {
        background: #125aa0;
    }

    button.success {
        background: #2e7d32; /* Green accent */
    }
</style>


</head>
<body>



<div id="fileList"></div>

<script>
const owner = "Rithvik-986";
const repo = "stmcpy";

const container = document.getElementById("fileList");

// Cache for downloaded file contents
const cache = {};

// Fetch all txt files from the repository
async function getFiles() {
    const response = await fetch(
        `https://api.github.com/repos/${owner}/${repo}/contents/`
    );

    if (!response.ok) {
        throw new Error("Failed to fetch repository contents.");
    }

    const data = await response.json();

    return data
        .filter(file =>
            file.type === "file" &&
            file.name.endsWith(".txt")
        )
        .sort((a, b) =>
            a.name.localeCompare(b.name, undefined, { numeric: true })
        );
}

// Create a heading
function addHeading(title) {
    const h2 = document.createElement("h2");
    h2.textContent = title;
    container.appendChild(h2);
}

// Create one file row
function createRow(file) {

    const row = document.createElement("div");
    row.className = "file";

    const name = document.createElement("span");

    // Remove .txt from display
    name.textContent = file.name.replace(".txt", "");

    const button = document.createElement("button");
    button.textContent = "Copy";

    button.onclick = async () => {

        try {

            // Download only once
            if (!cache[file.name]) {

                const response = await fetch(file.download_url);

                if (!response.ok)
                    throw new Error();

                cache[file.name] = await response.text();
            }

            await navigator.clipboard.writeText(cache[file.name]);

            button.textContent = "Copied!";
            button.classList.add("success");

            setTimeout(() => {
                button.textContent = "Copy";
                button.classList.remove("success");
            }, 1500);

        }
        catch (err) {
            console.error(err);
            alert("Failed to copy " + file.name);
        }

    };

    row.appendChild(name);
    row.appendChild(button);

    container.appendChild(row);
}

// Initialize page
async function init() {

    try {

        const files = await getFiles();

        const stmFiles = files.filter(f => f.name.startsWith("STM"));
        const sdcFiles = files.filter(f => f.name.startsWith("SDC"));

        if (stmFiles.length) {
            addHeading("STM");
            stmFiles.forEach(createRow);
        }

        if (sdcFiles.length) {

            const hr = document.createElement("hr");
            container.appendChild(hr);

            addHeading("SDC");
            sdcFiles.forEach(createRow);

        }

    }
    catch (err) {
        console.error(err);
        container.innerHTML = "<p>Unable to load files.</p>";
    }

}

init();
</script>

</body>
</html>
