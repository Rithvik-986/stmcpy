<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dummy</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        background: #121212; /* Dark background */
        color: #e0e0e0;      /* Light text */
        padding: 20px;
    }

    h1 {
        text-align: center;
        color: #ffffff;
    }

    .file {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #1e1e1e; /* Dark card background */
        margin: 10px 0;
        padding: 12px 18px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,.5);
    }

    button {
        padding: 8px 18px;
        border: none;
        border-radius: 5px;
        background: #1976d2; /* Blue accent */
        color: white;
        cursor: pointer;
        font-size: 14px;
    }

    button:hover {
        background: #125aa0;
    }

    button.success {
        background: #2e7d32; /* Green accent */
    }
</style>


</head>
<body>



<div id="fileList"></div>

<script>
    const owner = "Rithvik-986";
    const repo = "stmcpy";
    
    const container = document.getElementById("fileList");
    const hr = document.createElement("hr");
    const br = document.createElement("br");
    
    async function getFiles(sub) {
        const response = await fetch(
            `https://api.github.com/repos/${owner}/${repo}/contents/`
        );
    
        const data = await response.json();
    
        return data
            .filter(file => file.type === "file" && file.name.endsWith(".txt"))
            .map(file => file.name);
    }

    async function init() {
        const files = await getFiles();
    
        files
            .filter(f => f.name.startsWith("STM"))
            .forEach(f => createRow(f.name));
    
        container.appendChild(hr);
    
        files
            .filter(f => f.name.startsWith("SDC"))
            .forEach(f => createRow(f.name));
    }
    init();

    function createRow(file){
        
            const row = document.createElement("div");
            row.className = "file";
        
            const name = document.createElement("span");
            name.textContent = file;
        
            const button = document.createElement("button");
            button.textContent = "Copy";
        
            button.onclick = async () => {
                try {
                    const response = await fetch(file);
        
                    if (!response.ok)
                        throw new Error("Unable to fetch file.");
        
                    const text = await response.text();
        
                    await navigator.clipboard.writeText(text);
        
                    button.textContent = "Copied!";
                    button.classList.add("success");
        
                    setTimeout(() => {
                        button.textContent = "Copy";
                        button.classList.remove("success");
                    }, 1500);
        
                } catch (err) {
                    alert("Failed to copy " + file);
                    console.error(err);
                }
            };
        
            row.appendChild(name);
            row.appendChild(button);
        
            container.appendChild(row);
        
        }

</script>

</body>
</html>
